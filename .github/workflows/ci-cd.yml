name: Python CI/CD Pipeline with Docker

# Triggers for the pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: BUILD STAGE
  # ==========================================
  build:
    name: Build (Application & Docker Image)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Build Docker Container Image
        run: |
          echo "Building Docker Image..."
          docker build -t python-ci-cd-app:${{ github.sha }} -t python-ci-cd-app:latest .
          echo "Docker image built successfully!"
          docker images

  # ==========================================
  # STAGE 2: TEST STAGE
  # ==========================================
  test:
    name: Test (Pytest & Container Health)
    needs: build # Ensures Test runs ONLY after Build succeeds
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies for Testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Unit Tests with Pytest
        run: |
          echo "Running automated Pytest suite..."
          pytest test_app.py -v --junitxml=test-results.xml

      - name: 5. Container Integration Test (Smoke Test)
        run: |
          echo "Building container for smoke testing..."
          docker build -t python-ci-cd-app:test .
          
          echo "Starting container in background..."
          docker run -d --name test-container -p 5000:5000 python-ci-cd-app:test
          
          echo "Waiting 5 seconds for application startup..."
          sleep 5
          
          echo "Testing health check endpoint inside running container..."
          curl -f http://localhost:5000/health || (docker logs test-container && exit 1)
          
          echo "Stopping test container..."
          docker stop test-container && docker rm test-container

  # ==========================================
  # STAGE 3: DEPLOY STAGE
  # ==========================================
  deploy:
    name: Deploy (Package & Staging Deployment)
    needs: test # Ensures Deploy runs ONLY after Test succeeds
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Extract Metadata and Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 4. Build and Push Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 5. Simulate Production Deployment & Live Verification
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          echo "Pulling and launching deployed image in production environment: $IMAGE_NAME"
          docker run -d --name production-service -p 5000:5000 "$IMAGE_NAME"
          
          sleep 5
          echo "Verifying live deployment response..."
          curl -f http://localhost:5000/
          echo ""
          curl -f http://localhost:5000/health
          echo ""
          
          echo "========================================================"
          echo " Deployment Stage Completed Successfully!"
          echo " Application is live, healthy, and operational."
          echo "========================================================"
